services:
  - type: web
    name: wilkerson-collective-sovereign-stack
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: WILKERSON_BIND
        value: 0.0.0.0
      - key: DATABASE_URL
        fromDatabase:
          name: wilkerson-sovereign-db
          property: connectionString
      - key: GATEWAY_API_TOKEN
        generateValue: true
      - key: WORKER_POLL_MS
        value: 750
      - key: WORKER_LEASE_SECONDS
        value: 90
      - key: EXECUTION_SELF_TEST_ON_BOOT
        value: true

databases:
  - name: wilkerson-sovereign-db
    databaseName: wilkerson_sovereign
    user: wilkerson_sovereign
    plan: free
